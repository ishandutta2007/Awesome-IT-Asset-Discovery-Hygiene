<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="340" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b19" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="cyanBlueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="purplePinkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.6" />
      <circle cx="40" cy="0" r="1.5" fill="#38bdf8" opacity="0.3" />
    </pattern>

    <!-- Radar Sweep Blur Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseCircle {
      0%, 100% { transform: scale(1); opacity: 0.25; }
      50% { transform: scale(1.08); opacity: 0.55; }
    }
    @keyframes sweepRadar {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes floatPill {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }
    @keyframes floatPillReverse {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(7px); }
    }
    @keyframes dashMove {
      to { stroke-dashoffset: -100; }
    }
    .radar-sweep {
      transform-origin: 1040px 170px;
      animation: sweepRadar 8s linear infinite;
    }
    .radar-pulse-1 {
      transform-origin: 1040px 170px;
      animation: pulseCircle 4s ease-in-out infinite;
    }
    .pill-1 { animation: floatPill 5s ease-in-out infinite; }
    .pill-2 { animation: floatPillReverse 6s ease-in-out infinite; }
    .pill-3 { animation: floatPill 5.5s ease-in-out infinite 1s; }
    .data-line {
      stroke-dasharray: 6 6;
      animation: dashMove 3s linear infinite;
    }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="340" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="340" rx="16" fill="url(#cyberGrid)" />

  <!-- Outer Border Glow -->
  <rect width="1196" height="336" x="2" y="2" rx="15" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- DYNAMIC RADAR & DISCOVERY GRAPH IN BACKGROUND (Right Side) -->
  <g class="radar-pulse-1">
    <circle cx="1040" cy="170" r="130" fill="none" stroke="#0284c7" stroke-width="1.5" stroke-opacity="0.25" />
    <circle cx="1040" cy="170" r="95" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.35" />
    <circle cx="1040" cy="170" r="55" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.45" />
    <circle cx="1040" cy="170" r="20" fill="#0284c7" fill-opacity="0.2" />
  </g>

  <!-- Crosshairs -->
  <line x1="890" y1="170" x2="1190" y2="170" stroke="#0284c7" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="4 4" />
  <line x1="1040" y1="20" x2="1040" y2="320" stroke="#0284c7" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="4 4" />

  <!-- Animated Radar Sweep Cone -->
  <g class="radar-sweep">
    <path d="M 1040 170 L 1170 170 A 130 130 0 0 1 1132 262 Z" fill="url(#cyanBlueGrad)" opacity="0.16" />
    <line x1="1040" y1="170" x2="1170" y2="170" stroke="#38bdf8" stroke-width="2" opacity="0.8" filter="url(#glow)" />
  </g>

  <!-- Network Connection Nodes (Dynamic Discovered Assets) -->
  <g stroke="#38bdf8" stroke-width="1.2" opacity="0.75">
    <line x1="970" y1="110" x2="1040" y2="170" class="data-line" />
    <line x1="1040" y1="170" x2="1110" y2="115" class="data-line" />
    <line x1="1040" y1="170" x2="1080" y2="245" class="data-line" />
    <line x1="970" y1="110" x2="940" y2="210" class="data-line" />
  </g>

  <!-- Asset Blips with Glow -->
  <g filter="url(#glow)">
    <circle cx="970" cy="110" r="5" fill="#38bdf8" />
    <circle cx="1110" cy="115" r="4.5" fill="#10b981" />
    <circle cx="1080" cy="245" r="5.5" fill="#ec4899" />
    <circle cx="940" cy="210" r="4" fill="#a855f7" />
    <circle cx="1040" cy="170" r="6" fill="#38bdf8" />
  </g>

  <!-- DYNAMIC FLOATING TELEMETRY PILLS (Kept off to bottom/sides so foreground text stays crystal clear) -->
  <g class="pill-1" transform="translate(680, 52)">
    <rect width="180" height="34" rx="17" fill="#1e293b" fill-opacity="0.85" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="20" cy="17" r="5" fill="#10b981" />
    <text x="35" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">CAASM Reconciled</text>
  </g>

  <g class="pill-2" transform="translate(730, 245)">
    <rect width="185" height="34" rx="17" fill="#1e293b" fill-opacity="0.85" stroke="#a855f7" stroke-width="1.2" />
    <circle cx="20" cy="17" r="5" fill="#ec4899" />
    <text x="35" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">Zero Blind Spots</text>
  </g>

  <g class="pill-3" transform="translate(530, 255)">
    <rect width="175" height="34" rx="17" fill="#1e293b" fill-opacity="0.85" stroke="#10b981" stroke-width="1.2" />
    <circle cx="20" cy="17" r="5" fill="#38bdf8" />
    <text x="35" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">Continuous Audit</text>
  </g>

  <!-- FOREGROUND BRANDING & TYPOGRAPHY (Always in crisp foreground) -->
  <g transform="translate(65, 0)">
    <!-- Top Category Tag -->
    <rect x="0" y="48" width="220" height="28" rx="14" fill="#0369a1" fill-opacity="0.3" stroke="#0ea5e9" stroke-width="1" />
    <text x="14" y="67" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.5">ENTERPRISE SECURITY</text>

    <!-- Main Title with Gradient fill -->
    <text x="0" y="132" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">
      Awesome IT Asset
    </text>
    <text x="0" y="184" fill="url(#cyanBlueGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">
      Discovery &amp; Hygiene
    </text>

    <!-- Subtitle (Clean & Legible) -->
    <text x="0" y="224" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400">
      Curated Ecosystem of CAASM, Agentless Discovery &amp; CMDB Platforms
    </text>

    <!-- Feature Tags Row -->
    <g transform="translate(0, 252)">
      <rect x="0" y="0" width="105" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="14" y="17" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="500">🛡️ CAASM</text>

      <rect x="115" y="0" width="135" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="127" y="17" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="500">🔍 IT Hygiene</text>

      <rect x="260" y="0" width="115" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="272" y="17" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="500">🗄️ CMDB</text>

      <rect x="385" y="0" width="140" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="397" y="17" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="500">⚡ Open Source</text>
    </g>
  </g>
</svg>
